<text x="26" y="88" font-size="13" fill="#C7D6E6">Real-time car rental app with free kilometres and</text><text x="26" y="108" font-size="13" fill="#C7D6E6">offers, designed for students and working</text><text x="26" y="128" font-size="13" fill="#C7D6E6">professionals. Shippable software, not a demo in a</text><rect x="26" y="150" width="85" height="22" rx="3" fill="#00FF41" fill-opacity=".1" stroke="#00FF41" stroke-opacity=".8"/><text x="68" y="165" font-size="11" fill="#00FF41" text-anchor="middle">REAL-TIME</text><rect x="118.60000000000001" y="150" width="70" height="22" rx="3" fill="#00FF41" fill-opacity=".1" stroke="#00FF41" stroke-opacity=".8"/><text x="154" y="165" font-size="11" fill="#00FF41" text-anchor="middle">PRODUCT</text><rect x="196.40000000000003" y="150" width="62" height="22" rx="3" fill="#00FF41" fill-opacity=".1" stroke="#00FF41" stroke-opacity=".8"/><text x="228" y="165" font-size="11" fill="#00FF41" text-anchor="middle">OFFERS</text>
</g></g>
