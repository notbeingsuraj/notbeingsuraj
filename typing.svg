<g font-family="'JetBrains Mono','Fira Code','SF Mono','Consolas','Courier New',monospace" font-size="15"><text x="40" y="78" xml:space="preserve" clip-path="url(#c0)" filter="url(#g2)"><tspan fill="#00FF41">root@sur4j</tspan><tspan fill="#FF2A6D">:</tspan><tspan fill="#00F0FF">~</tspan><tspan fill="#FF2A6D">$ </tspan><tspan fill="#EAF6FF">whoami</tspan></text><text x="40" y="108" xml:space="preserve" clip-path="url(#c1)" filter="url(#g2)"><tspan fill="#00F0FF">  suraj_kumar  //  backend + ai engineer  //  systems builder</tspan></text><text x="40" y="138" xml:space="preserve" clip-path="url(#c2)" filter="url(#g2)"><tspan fill="#00FF41">root@sur4j</tspan><tspan fill="#FF2A6D">:</tspan><tspan fill="#00F0FF">~</tspan><tspan fill="#FF2A6D">$ </tspan><tspan fill="#EAF6FF">cat mission.txt</tspan></text><text x="40" y="168" xml:space="preserve" clip-path="url(#c3)" filter="url(#g2)"><tspan fill="#00F0FF">  build systems that survive contact with reality.</tspan></text><text x="40" y="198" xml:space="preserve" clip-path="url(#c4)" filter="url(#g2)"><tspan fill="#00FF41">root@sur4j</tspan><tspan fill="#FF2A6D">:</tspan><tspan fill="#00F0FF">~</tspan><tspan fill="#FF2A6D">$ </tspan><tspan fill="#EAF6FF">./threat_model --scope=everything</tspan></text><text x="40" y="228" xml:space="preserve" clip-path="url(#c5)" filter="url(#g2)"><tspan fill="#FF2A6D">  [!] user input .... hostile until validated</tspan></text><text x="40" y="258" xml:space="preserve" clip-path="url(#c6)" filter="url(#g2)"><tspan fill="#FF2A6D">  [!] llm output ..... untrusted until parsed</tspan></text><text x="40" y="288" xml:space="preserve" clip-path="url(#c7)" filter="url(#g2)"><tspan fill="#00FF41">root@sur4j</tspan><tspan fill="#FF2A6D">:</tspan><tspan fill="#00F0FF">~</tspan><tspan fill="#FF2A6D">$ </tspan><tspan fill="#EAF6FF">./status --live</tspan></text><text x="40" y="318" xml:space="preserve" clip-path="url(#c8)" filter="url(#g2)"><tspan fill="#00FF41">  [BUILDING] siteforge · fables_lab · carefree · monetra · inphase</tspan></text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7818;0.7828;0.9700;0.9710;1" dur="22.0s" repeatCount="indefinite"/>
