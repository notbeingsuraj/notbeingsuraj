<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="36" viewBox="0 0 1000 36">
<defs>
<linearGradient id="pk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F0FF" stop-opacity="0"/><stop offset="0.5" stop-color="#fff"/><stop offset="1" stop-color="#FF2E97" stop-opacity="0"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F0FF" stop-opacity="0"/><stop offset="0.2" stop-color="#00F0FF"/><stop offset="0.8" stop-color="#FF2E97"/><stop offset="1" stop-color="#FF2E97" stop-opacity="0"/></linearGradient>
<filter id="g" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="c"><rect x="0" y="0" width="1000" height="36"/></clipPath>
</defs>
<g clip-path="url(#c)">
<line x1="40" y1="18" x2="960" y2="18" stroke="url(#ln)" stroke-width="2" filter="url(#g)"><animate attributeName="opacity" values="1;0.7;1;0.9;1" dur="2.5s" repeatCount="indefinite"/></line>
<rect x="-160" y="16" width="160" height="4" fill="url(#pk)" filter="url(#g)"><animate attributeName="x" values="-160;1000" dur="3.2s" repeatCount="indefinite"/></rect>
<polygon points="500,8 510,18 500,28 490,18" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#g)"><animateTransform attributeName="transform" type="rotate" from="0 500 18" to="360 500 18" dur="6s" repeatCount="indefinite"/></polygon>
<polygon points="500,13 505,18 500,23 495,18" fill="#FF2E97"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></polygon>
<rect x="40" y="14" width="8" height="8" fill="#00F0FF" filter="url(#g)"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></rect>
<rect x="952" y="14" width="8" height="8" fill="#FF2E97" filter="url(#g)"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></rect>
</g></svg>